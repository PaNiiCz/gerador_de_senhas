<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src https://db.onlinewebfonts.com; img-src 'self' data:; object-src 'none'; base-uri 'none'">
    <meta name="description" content="Gerador e cofre de senhas com design luminoso">
    <title>Luminous Vault</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M12 2C9.79086 2 8 3.79086 8 6V8H6C4.89543 8 4 8.89543 4 10V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V10C20 8.89543 19.1046 8 18 8H16V6C16 3.79086 14.2091 2 12 2ZM12 4C13.1046 4 14 4.89543 14 6V8H10V6C10 4.89543 10.8954 4 12 4ZM12 15C13.1046 15 14 15.8954 14 17C14 18.1046 13.1046 19 12 19C10.8954 19 10 18.1046 10 17C10 15.8954 10.8954 15 12 15Z'/></svg>">
</head>
<body>

    <div class="card card--app" id="appCard" data-view="lock">

        <!-- ABAS (aparecem só depois de desbloquear) -->
        <nav class="tabs" id="tabs" hidden>
            <button class="tab active" data-tab="generator">Gerador</button>
            <button class="tab" data-tab="vault">Cofre</button>
            <button class="tab tab--lock" id="lockBtn" title="Bloquear agora">🔒</button>
        </nav>

                <!-- CONFIRMAÇÃO (aparece por cima do card) -->
        <div class="confirm-overlay" id="confirmOverlay" hidden>
            <div class="confirm-box">
                <p id="confirmText"></p>
                <div class="button-group">
                    <button id="confirmNo">Cancelar</button>
                    <button id="confirmYes" class="primary">Sim</button>
                </div>
            </div>
        </div>

        <div class="content">
            <!-- Ícone -->
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="3.2rem" height="3.2rem" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C9.79086 2 8 3.79086 8 6V8H6C4.89543 8 4 8.89543 4 10V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V10C20 8.89543 19.1046 8 18 8H16V6C16 3.79086 14.2091 2 12 2ZM12 4C13.1046 4 14 4.89543 14 6V8H10V6C10 4.89543 10.8954 4 12 4ZM12 15C13.1046 15 14 15.8954 14 17C14 18.1046 13.1046 19 12 19C10.8954 19 10 18.1046 10 17C10 15.8954 10.8954 15 12 15Z" fill="url(#iconGradient)" filter="url(#strong-inner)"/>
                    <defs>
                        <linearGradient id="iconGradient" x1="0" x2="0" y1="-1" y2="0.8">
                            <stop offset="0%" stop-color="#bbb" />
                            <stop offset="100%" stop-color="#555" />
                        </linearGradient>
                        <filter id="strong-inner">
                            <feFlood flood-color="#fff2" />
                            <feComposite operator="out" in2="SourceGraphic" />
                            <feMorphology operator="dilate" radius="8" />
                            <feGaussianBlur stdDeviation="32" />
                            <feComposite operator="atop" in2="SourceGraphic" />
                        </filter>
                    </defs>
                </svg>
            </div>

            <div class="bottom">

                <!-- ========== TELA: BLOQUEIO ========== -->
                <section id="view-lock">
                    <h4 id="lockTitle">Cofre bloqueado</h4>
                    <div class="stack">
                        <p class="hint" id="lockHint"></p>
                        <input class="field" id="masterInput" type="password" placeholder="Senha mestra" autocomplete="off">
                        <input class="field" id="masterConfirm" type="password" placeholder="Repita a senha mestra" autocomplete="off" hidden>
                        <div class="button-group">
                            <button id="unlockBtn" class="primary">Desbloquear</button>
                        </div>
                        <p class="msg" id="lockMsg"></p>
                    </div>
                </section>

                <!-- ========== TELA: GERADOR (o seu, intacto + botão Salvar) ========== -->
                <section id="view-generator" hidden>
                    <h4>Password Generator</h4>

                    <div class="password-display" id="passwordDisplay">
                        <span id="passwordText">Clique em Gerar</span>
                    </div>

                    <div class="controls">
                        <div class="slider-container">
                            <label>Comprimento: <span id="lengthLabel">16</span></label>
                            <input type="range" id="lengthSlider" min="8" max="32" value="16">
                        </div>

                        <div class="options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="uppercase" checked> A-Z
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="lowercase" checked> a-z
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="numbers" checked> 0-9
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="symbols" checked> !@#
                            </label>
                        </div>

                        <div class="button-group">
                            <button id="generateBtn">✦ Gerar</button>
                            <button id="copyBtn">📋 Copiar</button>
                            <button id="saveBtn">🔒 Salvar</button>
                        </div>

                        <div class="strength-container">
                            <span>Força:</span>
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <span id="strengthLabel">Média</span>
                        </div>
                    </div>
                </section>

                <!-- ========== TELA: COFRE ========== -->
                <section id="view-vault" hidden>
                    <h4>Cofre</h4>

                    <!-- Modo lista -->
                    <div id="vaultListMode">
                        <div class="vault-list" id="vaultList"></div>
                        <div class="button-group">
                            <button id="newBtn">+ Novo</button>
                            <button id="exportBtn">Exportar</button>
                            <button id="importBtn">Importar</button>
                        </div>
                        <input type="file" id="importFile" accept=".json,application/json" hidden>
                    </div>

                    <!-- Modo formulário -->
                    <div id="vaultFormMode" class="stack" hidden>
                        <input class="field" id="fTitle" placeholder="Título (ex: Instagram)" maxlength="80" autocomplete="off">
                        <input class="field" id="fSite" placeholder="Site / origem (ex: instagram.com)" maxlength="120" autocomplete="off">
                        <input class="field" id="fUser" placeholder="Usuário ou e-mail" maxlength="120" autocomplete="off">
                        <div class="pass-row">
                            <input class="field" id="fPass" type="password" placeholder="Senha" maxlength="256" autocomplete="off">
                            <button class="icon-btn" id="fShow" type="button" title="Mostrar/ocultar">👁</button>
                            <button class="icon-btn" id="fGen" type="button" title="Gerar senha forte">🎲</button>
                        </div>
                        <div class="button-group">
                            <button id="fSave" class="primary">Salvar</button>
                            <button id="fCancel">Cancelar</button>
                        </div>
                    </div>

                    <p class="msg" id="vaultMsg"></p>
                </section>

            </div>
        </div>
    </div>

    <script src="js/vault.js"></script>
    <script src="js/script.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
